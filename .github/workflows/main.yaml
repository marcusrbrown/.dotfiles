---
name: Main

'on':
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devcontainer-ci:
    name: Devcontainer CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: devcontainer-ci
        name: Build and start devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          imageName: ghcr.io/marcusrbrown/dotfiles-devcontainer
          imageTag: ${{ github.event_name == 'release' && format('{0},latest', github.event.release.tag_name) || 'latest' }}
          cacheFrom: ghcr.io/marcusrbrown/dotfiles-devcontainer
          eventFilterForPush: |
            push
            release
          runCmd: devcontainer-info

      - if: always()
        name: Display devcontainer output
        env:
          OUTPUT: ${{ steps.devcontainer-ci.outputs.runCmdOutput }}
        run: |
          echo "Devcontainer output:"
          echo "$OUTPUT"

  install-mise:
    name: Install mise
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        env:
          MISE_VERSION: 2026.9.0 # renovate: datasource=github-releases packageName=jdx/mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}

  script-tests-matrix:
    name: Script Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Verify lsof is available
        run: command -v lsof

      - name: Run opencode-doctor tests
        working-directory: .config/opencode/scripts
        # Tests needing a real OpenCode server binary skip themselves when none
        # resolves, so no runner is installed and no name filter is needed here.
        run: bun test opencode-doctor.test.ts

      - name: Run ollama-distill tests
        working-directory: .config/opencode/scripts
        run: bun test ollama-distill.test.ts

  # Aggregates the matrix into one stable status context. Branch protection
  # requires 'Script Tests'; a matrix reports per-leg names instead, so without
  # this the required check would never report and every PR would block.
  # `if: always()` matters for the same reason -- a skipped required check
  # blocks just as hard as a missing one.
  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    needs: [script-tests-matrix]
    if: always()
    steps:
      - name: Check matrix result
        env:
          RESULT: ${{ needs.script-tests-matrix.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Script Tests matrix did not succeed: $RESULT"
            exit 1
          fi
          echo "All Script Tests legs passed."
