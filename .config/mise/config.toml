[tools]
node = "24.21.0"
npm = "12.2.0"
bun = "1.4.2"
"aqua:pnpm/pnpm" = "12.11.2"
python = "3.15.0"
pipx = "1.17.12"
"pipx:poetry" = "2.5.1"
deno = "2.9.7"
rust = "1.99.0"
cargo-binstall = "1.25.2"
zig = "0.15.2"
zls = "0.16.0"
go = "1.27.2"
ast-grep = "0.45.3"

 # shfmt
"aqua:mvdan/sh" = "3.14.1"
"aqua:gitleaks/gitleaks" = "8.30.1"

"npm:typescript" = "7.0.2"
"npm:playwright" = "1.63.0"
"npm:prettier" = "3.9.9"
"npm:@bfra.me/prettier-config" = "0.16.13"
"npm:@biomejs/biome" = "2.5.15"
"npm:rimraf" = "6.1.3"
"npm:tsx" = "4.23.15"
"npm:@anthropic-ai/claude-code" = "2.1.270"
"npm:@fro.bot/harness" = "1.18.34-harness.6546eb64"
"npm:@github/copilot" = "1.0.92"
"npm:agent-browser" = "0.38.2"
"npm:skills" = "1.7.1"
"npm:ocx" = "2.0.15"
"npm:@marcusrbrown/infra" = "latest"

# Language Servers
"npm:pyright" = "1.1.414"
"npm:typescript-language-server" = "6.0.1"
lua-language-server = "3.19.1"

[env]
UV_SYSTEM_CERTS = "true"
NPM_TOKEN = "{{ env.NPM_TOKEN | default(value='') }}"
_.file = [{ path = "{{ env.HOME }}/.config/mise/.env.local", redact = true }]

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
bun = true

# A source build deadlocks: CPython's configure runs `python3.14 -V`, which hits
# the mise shim, which waits on the install lock held by the build itself.
[settings.python]
compile = false
