[tools]
node = "24.22.3"
npm = "12.2.2"
bun = "1.4.4"
"aqua:pnpm/pnpm" = "12.20.0"
python = "3.15.2"
pipx = "1.18.16"
"pipx:poetry" = "2.5.1"
deno = "2.9.8"
rust = "1.100.0"
cargo-binstall = "1.27.0"
zig = "0.15.2"
zls = "0.16.0"
go = "1.27.4"
ast-grep = "0.45.3"

 # shfmt
"aqua:mvdan/sh" = "3.14.1"
"aqua:gitleaks/gitleaks" = "8.30.1"

"npm:typescript" = "7.0.2"
"npm:playwright" = "1.65.0"
"npm:prettier" = "3.9.10"
"npm:@bfra.me/prettier-config" = "0.16.13"
"npm:@biomejs/biome" = "2.6.6"
"npm:rimraf" = "6.1.4"
"npm:tsx" = "4.23.15"
"npm:@anthropic-ai/claude-code" = "2.1.319"
"npm:@fro.bot/harness" = "1.19.5-harness.bf7f7dfe"
"npm:@github/copilot" = "1.0.109"
"npm:@openai/codex" = "0.165.0"
"npm:agent-browser" = "0.42.0"
"npm:skills" = "1.7.6"
"npm:ocx" = "2.0.15"
"npm:@marcusrbrown/infra" = "latest"
"npm:romdevtools" = "0.150.2"

# Language Servers
"npm:pyright" = "1.1.414"
"npm:typescript-language-server" = "6.0.3"
lua-language-server = "3.19.2"

[env]
UV_SYSTEM_CERTS = "true"
NPM_TOKEN = "{{ env.NPM_TOKEN | default(value='') }}"
_.file = [{ path = "{{ env.HOME }}/.config/mise/.env.local", redact = true }]

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
bun = true

# A source build deadlocks: CPython's configure runs `python3.14 -V`, which hits
# the mise shim, which waits on the install lock held by the build itself.
[settings.python]
compile = false
