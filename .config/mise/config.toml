[tools]
node = "24.20.0"
npm = "11.19.1"
bun = "1.4.0"
pnpm = "11.24.0"
python = "3.14.7"
pipx = "1.16.7"
"pipx:poetry" = "2.4.2"
deno = "2.9.6"
rust = "1.98.0"
cargo-binstall = "1.22.0"
zig = "0.15.2"
zls = "0.16.0"
go = "1.27.0"
ast-grep = "0.44.1"

 # shfmt
"aqua:mvdan/sh" = "3.14.0"
"aqua:gitleaks/gitleaks" = "8.30.1"

"npm:typescript" = "6.0.3"
"npm:playwright" = "1.62.1"
"npm:prettier" = "3.9.6"
"npm:@bfra.me/prettier-config" = "0.16.11"
"npm:@biomejs/biome" = "2.5.10"
"npm:rimraf" = "6.1.3"
"npm:tsx" = "4.23.12"
"npm:@anthropic-ai/claude-code" = "2.1.163"
"npm:@fro.bot/harness" = "1.18.21-harness.22dee0ee"
"npm:@github/copilot" = "1.0.80"
"npm:agent-browser" = "0.35.1"
"npm:skills" = "1.5.23"
"npm:ocx" = "2.0.15"
"npm:@marcusrbrown/infra" = "latest"

# Language Servers
"npm:pyright" = "1.1.413"
"npm:typescript-language-server" = "5.3.0"

[env]
UV_SYSTEM_CERTS = "true"
NPM_TOKEN = "{{ env.NPM_TOKEN | default(value='') }}"
_.file = [{ path = "{{ env.HOME }}/.config/mise/.env.local", redact = true }]

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
bun = true
