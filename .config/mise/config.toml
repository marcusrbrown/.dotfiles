[tools]
node = "24.21.0"
npm = "12.0.2"
bun = "1.4.2"
pnpm = "12.4.0"
python = "3.14.7"
pipx = "1.17.2"
"pipx:poetry" = "2.4.3"
deno = "2.9.6"
rust = "1.98.1"
cargo-binstall = "1.23.0"
zig = "0.15.2"
zls = "0.16.0"
go = "1.27.1"
ast-grep = "0.45.3"

 # shfmt
"aqua:mvdan/sh" = "3.14.1"
"aqua:gitleaks/gitleaks" = "8.30.1"

"npm:typescript" = "7.0.2"
"npm:playwright" = "1.63.0"
"npm:prettier" = "3.9.6"
"npm:@bfra.me/prettier-config" = "0.16.11"
"npm:@biomejs/biome" = "2.5.12"
"npm:rimraf" = "6.1.3"
"npm:tsx" = "4.23.13"
"npm:@anthropic-ai/claude-code" = "2.1.163"
"npm:@fro.bot/harness" = "1.18.30-harness.7c479429"
"npm:@github/copilot" = "1.0.83"
"npm:agent-browser" = "0.37.1"
"npm:skills" = "1.5.25"
"npm:ocx" = "2.0.15"
"npm:@marcusrbrown/infra" = "latest"

# Language Servers
"npm:pyright" = "1.1.413"
"npm:typescript-language-server" = "6.0.0"

[env]
UV_SYSTEM_CERTS = "true"
NPM_TOKEN = "{{ env.NPM_TOKEN | default(value='') }}"
_.file = [{ path = "{{ env.HOME }}/.config/mise/.env.local", redact = true }]

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
bun = true
